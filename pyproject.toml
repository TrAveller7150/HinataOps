[project]
name = "hinataops"
version = "0.1.0"
description = "Evidence-driven operations agent demo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.26,<2",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
