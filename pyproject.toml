[project]
name = "hinataops"
version = "0.1.0"
description = "Minimum credible implementation of a production-oriented SRE investigation platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.0,<2",
    "mcp>=1.26,<2",
    "openai>=2.0,<3",
    "pydantic>=2.12,<3",
    "rich>=14,<15",
]

[project.scripts]
hinataops = "hinataops.cli:main"

[project.entry-points."hinataops.toolsets"]
aoi_learn_judge = "hinataops.ops_mcp.toolsets.aoi_learn_judge.plugin:create_plugin"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
